<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Saya - Portofolio Mahasiswa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; padding: 30px 15px; }
        .container { max-width: 850px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        header { margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        h1 { color: #1e3a8a; font-size: 26px; margin-bottom: 8px; }
        nav ul { list-style: none; display: flex; gap: 15px; }
        nav a { color: #2563eb; text-decoration: none; font-weight: 600; font-size: 14px; }
        nav a:hover { text-decoration: underline; }

        .card { background: #f3ddeb; border: 1px solid #f0d0f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card h3 { font-size: 16px; color: #9b0a87; margin-bottom: 12px; }

        /* Form Styling */
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #334155; }
        .form-control { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #2563eb; }
        .checkbox-group { flex-direction: row; align-items: center; gap: 8px; }
        .btn-submit { background: #1e3a8a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-submit:hover { background: #1d4ed8; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: center; }
        .stat-card h3 { font-size: 12px; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card p { font-size: 20px; font-weight: bold; color: #1e3a8a; }

        /* Filter Buttons */
        .filter-group { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-filter { padding: 8px 16px; border: 1px solid #cbd5e1; background: #ffffff; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .btn-filter.active, .btn-filter:hover { background: #1e3a8a; color: #ffffff; border-color: #1e3a8a; }

        /* Project Item Card */
        .project-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: #ffffff; transition: transform 0.15s; }
        .project-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .project-info h4 { font-size: 16px; color: #0f172a; margin-bottom: 4px; }
        .project-category { display: inline-block; font-size: 11px; color: #0284c7; background: #e0f2fe; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; font-weight: 600; }
        .project-budget { font-size: 14px; color: #334155; font-weight: 600; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }

        .action-btns { display: flex; gap: 6px; margin-top: 10px; }
        .btn-action { padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-toggle { background: #e2e8f0; color: #334155; }
        .btn-toggle:hover { background: #cbd5e1; }
        .btn-delete { background: #fee2e2; color: #991b1b; }
        .btn-delete:hover { background: #fca5a5; }

        footer { margin-top: 30px; text-align: center; color: #64748b; font-size: 13px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Portofolio Proyek</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="kontak.html">Hubungi Saya</a></li>
                    <li><a href="resume.html">Resume</a></li>
                    <li><a href="project.html">Proyek</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- FITUR 1: Formulir Input Proyek Dinamis -->
            <div class="card">
                <h3>Formulir Tambah Proyek Baru</h3>
                <form id="project-form">
                    <div class="form-group">
                        <label for="input-title">Judul Proyek</label>
                        <input type="text" id="input-title" class="form-control" placeholder="Masukkan judul proyek...">
                    </div>
                    <div class="form-group">
                        <label for="input-category">Kategori</label>
                        <select id="input-category" class="form-control">
                            <option value="Web App">Web App</option>
                            <option value="Mobile App">Mobile App</option>
                            <option value="Desktop App">Desktop App</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-budget">Estimasi Anggaran (Rp)</label>
                        <input type="number" id="input-budget" class="form-control" placeholder="Masukkan nominal anggaran...">
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="input-completed">
                        <label for="input-completed">Sudah Selesai</label>
                    </div>
                    <button type="submit" class="btn-submit">Tambah Proyek</button>
                </form>
            </div>

            <!-- FITUR 2: Live Search Pencarian Real-Time -->
            <div class="card" style="padding: 12px 20px;">
                <input type="text" id="search-input" class="form-control" placeholder="Cari nama proyek secara real-time...">
            </div>

            <!-- Kartu Statistik Ringkasan -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Proyek</h3>
                    <p id="stat-total-projects">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Anggaran</h3>
                    <p id="stat-total-budget">Rp 0</p>
                </div>
                <div class="stat-card">
                    <h3>Selesai Dikerjakan</h3>
                    <p id="stat-completed-projects">0</p>
                </div>
            </div>

            <!-- Tombol Filter Kategori -->
            <div class="filter-group">
                <button class="btn-filter active" data-category="Semua">Semua Proyek</button>
                <button class="btn-filter" data-category="Web App">Web App</button>
                <button class="btn-filter" data-category="Mobile App">Mobile App</button>
                <button class="btn-filter" data-category="Desktop App">Desktop App</button>
                <button class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
            </div>

            <!-- Container Daftar Proyek -->
            <div id="project-list"></div>
        </main>

        <footer>
            <p>&copy; 2026 Portofolio Mahasiswa - All Rights Reserved.</p>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
